[project]
name = "phd-tracker-api"
version = "0.1.0"
description = "PhD Tracker core API — auth, entities, APR workflow, search"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115",
	"uvicorn[standard]>=0.30",
	"sqlalchemy[asyncio]>=2.0",
	"psycopg[binary]>=3.2",
	"pydantic-settings>=2.4",
	"pydantic[email]>=2.9",
	"pyjwt>=2.9",
	"argon2-cffi>=23.1",
	"alembic>=1.13",
	"python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.3",
	"httpx>=0.27",
	"ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Form()/HTTPBearer in parameter defaults is the FastAPI idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.security.HTTPBearer"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "E101"]  # DDL string blocks: long CHECK lists, space-indented SQL

[tool.pytest.ini_options]
testpaths = ["tests"]