spring:
  application:
    name: phd-tracker
  datasource:
    url: jdbc:mysql://localhost:3306/phd_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${PHD_TRACKER_DB_USERNAME:root}
    password: ${PHD_TRACKER_DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${PHD_TRACKER_JWT_SECRET:Y2hhbmdlLW1lLXRvLWEtc3Ryb25nLXNlY3JldC1rZXktZm9yLXByb2R1Y3Rpb24=}
  expiration-ms: 86400000

logging:
  level:
    root: INFO
    edu.university.phdtracker: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
