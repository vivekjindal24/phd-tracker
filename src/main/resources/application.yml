spring:
  datasource:
    url: jdbc:mysql://localhost:3306/phd_tracker?useSSL=false&serverTimezone=UTC
    username: ${PHD_TRACKER_DB_USERNAME:root}
    password: ${PHD_TRACKER_DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8080

jwt:
  secret: ${PHD_TRACKER_JWT_SECRET:change-me}
  expiration-ms: 86400000

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

