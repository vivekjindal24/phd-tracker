# Local development: Postgres + API + export + (already-runnable) web.
# Secrets come from a .env file that is gitignored — never committed.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: phd
      POSTGRES_PASSWORD: phd
      POSTGRES_DB: phd_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phd"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: services/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://phd:phd@db:5432/phd_tracker
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8900:8000"

  export:
    build: services/export
    depends_on:
      - api
    environment:
      API_URL: http://api:8000/api/v1
      PORT: "8902"
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8902:8902"

  # web runs with `npm run dev` in ./web (needs NEXT_PUBLIC_API_URL /
  # NEXT_PUBLIC_EXPORT_URL; see web/README.md). Add it here only if a
  # containerized web is ever wanted — Vercel deploys it in production.

volumes:
  pgdata: