name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anveshan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/anveshan_test
      S3_ENDPOINT: http://localhost:3900
      S3_REGION: garage
      S3_BUCKET: anveshan-test
      S3_TEST_BUCKET: anveshan-test
      # Throwaway credentials for the CI-only Garage container below.
      S3_ACCESS_KEY_ID: GK0123456789abcdef01234567
      S3_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_CAPACITY: 1GB
    steps:
      - uses: actions/checkout@v4
      - name: File store (same Garage image and setup script as production)
        run: |
          docker run -d --name garage -p 3900:3900 \
            -e GARAGE_RPC_SECRET=$(openssl rand -hex 32) \
            -v "$PWD/deploy/garage.toml:/etc/garage.toml:ro" dxflrs/garage:v2.5.0
          GARAGE="docker exec garage /garage" sh deploy/garage-init.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: services/api
        run: ruff check . && ruff format --check .
      - name: Test (runs the full migration chain first)
        working-directory: services/api
        run: pytest -q

  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8900
      NEXT_PUBLIC_EXPORT_URL: http://localhost:8902
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Fresh install of the self-hosted stack (PRD §13): build every image, boot, set up
  # the file store, bootstrap the root admin, then reach each service through Caddy.
  stack:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f deploy/compose.prod.yml
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway deploy/.env
        run: |
          sed -e 's/^DOMAIN=.*/DOMAIN=localhost/' \
              -e 's/^FILES_DOMAIN=.*/FILES_DOMAIN=files.localhost/' \
              -e 's/^SCHEME=.*/SCHEME=http/' \
              -e "s|^DATA_DIR=.*|DATA_DIR=$RUNNER_TEMP/data|" \
              -e "s|^BACKUP_DIR=.*|BACKUP_DIR=$RUNNER_TEMP/backup|" \
              -e 's/^GARAGE_CAPACITY=.*/GARAGE_CAPACITY=1GB/' \
              -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
              -e "s/^CRON_SECRET=.*/CRON_SECRET=$(openssl rand -hex 32)/" \
              -e "s/^GARAGE_RPC_SECRET=.*/GARAGE_RPC_SECRET=$(openssl rand -hex 32)/" \
              -e "s/^S3_ACCESS_KEY_ID=.*/S3_ACCESS_KEY_ID=GK$(openssl rand -hex 12)/" \
              -e "s/^S3_SECRET_ACCESS_KEY=.*/S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)/" \
              deploy/.env.example > deploy/.env
      - name: Build and boot
        run: $COMPOSE up -d --build --wait
      - name: API is up (migrations ran) behind Caddy
        run: curl -fsS --retry 60 --retry-all-errors --retry-delay 2 http://localhost/api/v1/healthz
      - name: File store
        run: sh deploy/garage-init.sh
      - name: Bootstrap root admin
        run: |
          $COMPOSE exec -T -e SEED_PASSWORD=ci-password-0123456789 api \
            python -m app.seed --bootstrap --university "CI University" --code CIU \
            --admin-email admin@ci.example.org --admin-name "CI Admin"
      - name: Reach every service through Caddy
        run: |
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost/export/healthz
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null http://localhost/
          curl -fsS -X POST http://localhost/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@ci.example.org","password":"ci-password-0123456789"}' | grep -q access_token
      - name: Scheduled jobs
        run: |
          $COMPOSE exec -T cron run.sh daily
          $COMPOSE exec -T cron run.sh backup
          ls "$RUNNER_TEMP"/backup/db/anveshan-*.dump
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color
