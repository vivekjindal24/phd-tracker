name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phd_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/phd_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: services/api
        run: ruff check .
      - name: Migrate (DDL smoke test)
        working-directory: services/api
        run: alembic upgrade head
      - name: Test
        working-directory: services/api
        run: pytest

  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: services/export
        run: npm ci
      - name: Typecheck
        working-directory: services/export
        run: npm run typecheck
      - name: Test
        working-directory: services/export
        run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        # strict TS is the type gate; NEXT_PUBLIC_* default to localhost in api.ts
        working-directory: web
        run: npm run build