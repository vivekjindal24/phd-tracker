name: keepalive

# Render free services spin down after 15 min without inbound traffic (first
# request then pays a ~20s cold start). This pings both healthz endpoints every
# 5 minutes so the daily-use app never appears dead. Neon's own suspend is fine
# (~0.5s resume), so we don't need a DB-touching ping.
on:
  schedule:
    # every 5 min, offset off :00/:30 to dodge GH's busiest marks
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz endpoints
        run: |
          for url in https://phd-tracker-api.onrender.com/api/v1/healthz \
                      https://phd-tracker-export.onrender.com/healthz; do
            code=$(curl -s -m 90 -o /dev/null -w '%{http_code}' --retry 2 "$url") || code=000
            echo "$url → $code"
          done