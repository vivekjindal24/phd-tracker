name: cron

# The daily job for the free-cloud dev deployment (ARCHITECTURE.md §10); the self-hosted
# stack runs its own cron container. Scheduled runs only fire on the default branch.
on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    # Set repo variable API_BASE_URL and secret CRON_SECRET to switch this on.
    if: vars.API_BASE_URL != ''
    steps:
      - run: |
          curl -fsS --retry 3 --retry-delay 30 --max-time 120 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ vars.API_BASE_URL }}/api/v1/internal/cron/daily"
